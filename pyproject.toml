[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-hook-model"
version = "0.1.0"
description = "An uncalibrated, no-wash secondary-conjugate assay simulator and evidence atlas."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
license = {text = "MIT"}
authors = [{name = "Ermelinda Damko"}]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.7", "markdown>=3.6"]
fast = ["numba>=0.60"]

[project.scripts]
organoid-hook = "organoid_hook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
